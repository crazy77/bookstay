<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>map overlay (mobile · 600×692 portrait)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 600px; height: 692px; overflow: hidden; }
.wrap { position: relative; width: 600px; height: 692px; }
.wrap img { display: block; width: 600px; height: 692px; }
svg { position: absolute; top: 0; left: 0; }
text {
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
}
</style>
</head>
<body>
<div class="wrap">
  <img src="assets/map-detail-mobile-raw.png">
  <svg viewBox="0 0 600 692" width="600" height="692">
    <defs>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
      </filter>
    </defs>

    <!-- Walking path: thicker for mobile -->
    <path d="M 470 165 L 155 255 L 195 432"
          stroke="#a33a3a" stroke-width="11" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="20 12"
          filter="url(#sh)"/>

    <!-- Direction arrow on diagonal segment (pointing SW) -->
    <polygon points="290,222 328,184 338,228" fill="#a33a3a" stroke="white" stroke-width="3.5" stroke-linejoin="round" filter="url(#sh)"/>

    <!-- Direction arrow on vertical segment (pointing south) -->
    <polygon points="175,372 152,330 200,330" fill="#a33a3a" stroke="white" stroke-width="3.5" stroke-linejoin="round" filter="url(#sh)"/>

    <!-- Entry marker at junction with 한림로 -->
    <circle cx="470" cy="165" r="11" fill="#a33a3a" stroke="white" stroke-width="3.5"/>

    <!-- Entry label (narrower so 한림로 vertical text stays visible at right edge) -->
    <g filter="url(#sh)">
      <rect x="115" y="78" width="300" height="76" rx="10" fill="#a33a3a"/>
      <text x="265" y="129" text-anchor="middle" font-size="34" fill="white">한림로에서 진입</text>
    </g>

    <!-- End-point dot at the actual door -->
    <circle cx="195" cy="432" r="12" fill="#a33a3a" stroke="white" stroke-width="3.5"/>

    <!-- Destination pin (offset right of door so endpoint stays visible) -->
    <g filter="url(#sh)">
      <path d="M 260 432
               C 240 410 226 392 226 376
               A 32 32 0 0 1 290 376
               C 290 392 276 410 260 432 Z"
            fill="#a33a3a" stroke="white" stroke-width="3.5"/>
      <circle cx="260" cy="372" r="10" fill="white"/>
    </g>

    <!-- Destination label -->
    <g filter="url(#sh)">
      <rect x="100" y="465" width="280" height="74" rx="10" fill="white" stroke="#a33a3a" stroke-width="3"/>
      <text x="240" y="514" text-anchor="middle" font-size="34" fill="#a33a3a">해묘서가 대문</text>
    </g>
  </svg>
</div>
</body>
</html>
