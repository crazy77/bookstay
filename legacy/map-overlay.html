<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>map overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1157px; height: 692px; overflow: hidden; }
.wrap { position: relative; width: 1157px; height: 692px; }
.wrap img { display: block; width: 1157px; height: 692px; }
svg { position: absolute; top: 0; left: 0; }
text {
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
}
</style>
</head>
<body>
<div class="wrap">
  <img src="assets/map-detail-raw.png">
  <svg viewBox="0 0 1157 692" width="1157" height="692">
    <defs>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
      </filter>
    </defs>

    <!-- Walking path: diagonal SW (top alley) then south (vertical alley); endpoint = actual door -->
    <path d="M 870 165 L 555 255 L 595 432"
          stroke="#a33a3a" stroke-width="9" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="16 10"
          filter="url(#sh)"/>

    <!-- Direction arrow on diagonal segment (pointing SW) -->
    <polygon points="697,217 722,193 729,222" fill="#a33a3a" stroke="white" stroke-width="3" stroke-linejoin="round" filter="url(#sh)"/>

    <!-- Direction arrow on vertical segment (pointing south) -->
    <polygon points="577,360 562,332 592,332" fill="#a33a3a" stroke="white" stroke-width="3" stroke-linejoin="round" filter="url(#sh)"/>

    <!-- Entry marker at junction with 한림로 -->
    <circle cx="870" cy="165" r="9" fill="#a33a3a" stroke="white" stroke-width="3"/>

    <!-- Entry label -->
    <g filter="url(#sh)">
      <rect x="650" y="105" width="220" height="48" rx="6" fill="#a33a3a"/>
      <text x="760" y="137" text-anchor="middle" font-size="22" fill="white">한림로에서 진입</text>
    </g>

    <!-- End-point dot at the actual door (so it stays visible) -->
    <circle cx="595" cy="432" r="9" fill="#a33a3a" stroke="white" stroke-width="3"/>

    <!-- Destination pin (offset slightly right of the door, path endpoint stays visible) -->
    <g filter="url(#sh)">
      <path d="M 628 432
               C 612 413 599 397 599 384
               A 29 29 0 0 1 657 384
               C 657 397 644 413 628 432 Z"
            fill="#a33a3a" stroke="white" stroke-width="3"/>
      <circle cx="628" cy="380" r="9" fill="white"/>
    </g>

    <!-- Destination label (under pin) -->
    <g filter="url(#sh)">
      <rect x="539" y="450" width="178" height="48" rx="6" fill="white" stroke="#a33a3a" stroke-width="2.5"/>
      <text x="628" y="482" text-anchor="middle" font-size="22" fill="#a33a3a">해묘서가 대문</text>
    </g>
  </svg>
</div>
</body>
</html>
